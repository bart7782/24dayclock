<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24-Hour Activity Clock</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --text-muted: #888;
    --accent: #4a9eff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 32px;
  }

  h1 {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ── Clock ─────────────────────────────────────────── */
  .clock-wrap {
    position: relative;
    width: min(520px, 92vw);
    aspect-ratio: 1;
  }

  #clockSvg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  /* ── Panel layout ───────────────────────────────────── */
  .panel {
    width: min(820px, 96vw);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 600px) {
    .panel { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card h2 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  /* ── Form ───────────────────────────────────────────── */
  .form-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-row label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .form-row input[type="text"],
  .form-row input[type="time"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    width: 100%;
    transition: border-color .15s;
  }

  .form-row input:focus {
    border-color: var(--accent);
  }

  .time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .color-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform .1s, border-color .1s;
    flex-shrink: 0;
  }

  .swatch:hover { transform: scale(1.15); }
  .swatch.selected { border-color: #fff; transform: scale(1.15); }

  .color-custom {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px dashed var(--border);
    cursor: pointer;
    background: transparent;
    padding: 0;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }

  .color-custom input[type="color"] {
    position: absolute;
    inset: -4px;
    width: calc(100% + 8px);
    height: calc(100% + 8px);
    border: none;
    cursor: pointer;
    opacity: 0;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    letter-spacing: .5px;
  }

  .btn:hover { opacity: .85; }
  .btn:active { transform: scale(.97); }

  .btn-primary {
    background: var(--accent);
    color: #fff;
  }

  .btn-ghost {
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  /* ── Activity list ──────────────────────────────────── */
  .activity-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 340px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .activity-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color .15s;
  }

  .activity-item:hover { border-color: #444; }
  .activity-item.editing { border-color: var(--accent); }

  .act-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .act-info { flex: 1; min-width: 0; }

  .act-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .act-time {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .act-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 5px;
    line-height: 1;
    font-size: 14px;
    transition: color .15s, background .15s;
  }

  .icon-btn:hover { color: var(--text); background: var(--border); }

  .empty-hint {
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
    padding: 20px 0;
  }

  /* ── Toast ──────────────────────────────────────────── */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #222;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    pointer-events: none;
    transition: transform .3s ease;
    z-index: 999;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<h1>24-Hour Activity Clock</h1>

<div class="clock-wrap">
  <svg id="clockSvg" viewBox="-260 -260 520 520"></svg>
</div>

<div class="panel">
  <!-- Add / Edit form -->
  <div class="card">
    <h2 id="formTitle">Add Activity</h2>

    <div class="form-row">
      <label>Activity name</label>
      <input type="text" id="actName" placeholder="e.g. Sleep, Work, Exercise…" maxlength="40">
    </div>

    <div class="time-row">
      <div class="form-row">
        <label>Start</label>
        <input type="time" id="actStart" value="08:00">
      </div>
      <div class="form-row">
        <label>End</label>
        <input type="time" id="actEnd" value="09:00">
      </div>
    </div>

    <div class="form-row">
      <label>Color</label>
      <div class="color-row" id="colorRow">
        <!-- swatches injected by JS -->
      </div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn btn-primary" id="saveBtn" onclick="saveActivity()">Add Activity</button>
      <button class="btn btn-ghost" id="cancelBtn" style="display:none" onclick="cancelEdit()">Cancel</button>
    </div>
  </div>

  <!-- Activity list -->
  <div class="card">
    <h2>Activities <span id="actCount" style="color:var(--text-muted);font-weight:400"></span></h2>
    <div class="activity-list" id="activityList">
      <p class="empty-hint">No activities yet.<br>Add one on the left!</p>
    </div>
    <button class="btn btn-ghost" style="font-size:11px" onclick="clearAll()">Clear all</button>
  </div>
</div>

<div id="toast"></div>

<script>
// ── Palette ──────────────────────────────────────────────────────────────────
const PALETTE = [
  '#4a6fa5','#6a5acd','#9b59b6','#c0392b',
  '#e67e22','#f1c40f','#27ae60','#1abc9c',
  '#16a085','#2980b9','#8e44ad','#d35400',
  '#c0392b','#e91e63','#00bcd4','#795548',
];

// ── State ────────────────────────────────────────────────────────────────────
let activities = JSON.parse(localStorage.getItem('clock-activities') || '[]');
let editingId  = null;
let selectedColor = PALETTE[0];

// ── Init ─────────────────────────────────────────────────────────────────────
buildSwatches();
render();
setInterval(render, 1000);

// ── Color swatches ───────────────────────────────────────────────────────────
function buildSwatches() {
  const row = document.getElementById('colorRow');
  row.innerHTML = '';

  PALETTE.forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c === selectedColor ? ' selected' : '');
    s.style.background = c;
    s.onclick = () => selectColor(c, s);
    row.appendChild(s);
  });

  // custom color picker
  const wrap = document.createElement('div');
  wrap.className = 'color-custom';
  wrap.title = 'Custom color';
  wrap.style.background = PALETTE.includes(selectedColor) ? 'transparent' : selectedColor;

  const picker = document.createElement('input');
  picker.type = 'color';
  picker.value = '#ffffff';
  picker.oninput = e => {
    selectedColor = e.target.value;
    wrap.style.background = selectedColor;
    document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
  };

  wrap.appendChild(picker);
  row.appendChild(wrap);
}

function selectColor(c, el) {
  selectedColor = c;
  document.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
}

// ── Save / edit / delete ──────────────────────────────────────────────────────
function saveActivity() {
  const name  = document.getElementById('actName').value.trim();
  const start = document.getElementById('actStart').value;
  const end   = document.getElementById('actEnd').value;

  if (!name)  { toast('Enter an activity name'); return; }
  if (!start || !end) { toast('Set start and end times'); return; }

  const startM = timeToMinutes(start);
  let   endM   = timeToMinutes(end);
  if (endM === startM) { toast('Start and end can\'t be the same'); return; }

  const entry = { id: editingId ?? Date.now(), name, start, end, color: selectedColor };

  if (editingId !== null) {
    const idx = activities.findIndex(a => a.id === editingId);
    activities[idx] = entry;
    editingId = null;
  } else {
    activities.push(entry);
  }

  persist();
  resetForm();
  render();
}

function editActivity(id) {
  const a = activities.find(a => a.id === id);
  if (!a) return;

  editingId = id;
  document.getElementById('actName').value  = a.name;
  document.getElementById('actStart').value = a.start;
  document.getElementById('actEnd').value   = a.end;
  selectedColor = a.color;
  buildSwatches();

  document.getElementById('formTitle').textContent = 'Edit Activity';
  document.getElementById('saveBtn').textContent   = 'Save Changes';
  document.getElementById('cancelBtn').style.display = '';

  document.getElementById('activityList').querySelectorAll('.activity-item')
    .forEach(el => el.classList.toggle('editing', +el.dataset.id === id));
}

function deleteActivity(id) {
  activities = activities.filter(a => a.id !== id);
  if (editingId === id) cancelEdit();
  persist();
  render();
}

function cancelEdit() {
  editingId = null;
  resetForm();
  render();
}

function clearAll() {
  if (!activities.length) return;
  if (!confirm('Clear all activities?')) return;
  activities = [];
  persist();
  cancelEdit();
  render();
}

function resetForm() {
  document.getElementById('actName').value  = '';
  document.getElementById('actStart').value = '08:00';
  document.getElementById('actEnd').value   = '09:00';
  selectedColor = PALETTE[0];
  buildSwatches();
  document.getElementById('formTitle').textContent = 'Add Activity';
  document.getElementById('saveBtn').textContent   = 'Add Activity';
  document.getElementById('cancelBtn').style.display = 'none';
  document.getElementById('activityList').querySelectorAll('.activity-item')
    .forEach(el => el.classList.remove('editing'));
}

function persist() {
  localStorage.setItem('clock-activities', JSON.stringify(activities));
}

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  renderClock();
  renderList();
}

function renderList() {
  const el = document.getElementById('activityList');
  const count = document.getElementById('actCount');
  count.textContent = activities.length ? `(${activities.length})` : '';

  if (!activities.length) {
    el.innerHTML = '<p class="empty-hint">No activities yet.<br>Add one on the left!</p>';
    return;
  }

  // sort by start time
  const sorted = [...activities].sort((a,b) => timeToMinutes(a.start) - timeToMinutes(b.start));

  el.innerHTML = sorted.map(a => {
    const startM = timeToMinutes(a.start);
    let   endM   = timeToMinutes(a.end);
    if (endM <= startM) endM += 1440;
    const dur = endM - startM;
    const h = Math.floor(dur/60), m = dur%60;
    const durStr = h ? `${h}h ${m}m` : `${m}m`;

    return `<div class="activity-item${editingId === a.id ? ' editing' : ''}" data-id="${a.id}" onclick="editActivity(${a.id})">
      <div class="act-dot" style="background:${a.color}"></div>
      <div class="act-info">
        <div class="act-name">${escHtml(a.name)}</div>
        <div class="act-time">${a.start} – ${a.end} &nbsp;·&nbsp; ${durStr}</div>
      </div>
      <div class="act-actions">
        <button class="icon-btn" title="Delete" onclick="event.stopPropagation();deleteActivity(${a.id})">✕</button>
      </div>
    </div>`;
  }).join('');
}

// ── SVG Clock ─────────────────────────────────────────────────────────────────
const R_OUTER = 220;
const R_INNER = 160;
const R_TICKS_OUTER = 225;
const R_TICKS_INNER_H = 210;
const R_TICKS_INNER_M = 215;
const R_LABELS = 240;

function renderClock() {
  const svg = document.getElementById('clockSvg');
  const now  = new Date();
  const totalMinutes = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;

  const dayNames  = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  const monthNames = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  const dayName = dayNames[now.getDay()];
  const dateStr = `${monthNames[now.getMonth()]} ${now.getDate()}`;
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

  let html = '';

  html += `<circle cx="0" cy="0" r="${R_OUTER}" fill="#111" stroke="#1a1a1a" stroke-width="1"/>`;

  activities.forEach(a => {
    html += arcSegment(a.start, a.end, a.color, a.name);
  });

  for (let i = 0; i < 1440; i++) {
    const isHour = i % 60 === 0;
    const isQuarter = i % 15 === 0;
    const isHalf = i % 5 === 0;

    if (!isHalf && !isHour && !isQuarter) continue;

    const angle = (i / 1440) * 360 - 90;
    const rad   = angle * Math.PI / 180;
    const inner = isHour ? R_TICKS_INNER_H : (isQuarter ? 213 : R_TICKS_INNER_M);
    const x1 = Math.cos(rad) * inner;
    const y1 = Math.sin(rad) * inner;
    const x2 = Math.cos(rad) * R_TICKS_OUTER;
    const y2 = Math.sin(rad) * R_TICKS_OUTER;
    const w  = isHour ? 1.5 : 0.7;
    const col = isHour ? '#888' : '#444';
    html += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${col}" stroke-width="${w}"/>`;
  }

  [[0,'00:00'],[6*60,'6:00'],[12*60,'12:00'],[18*60,'18:00']].forEach(([m,label]) => {
    const angle = (m / 1440) * 360 - 90;
    const rad   = angle * Math.PI / 180;
    const x = Math.cos(rad) * R_LABELS;
    const y = Math.sin(rad) * R_LABELS;
    html += `<text x="${x.toFixed(2)}" y="${y.toFixed(2)}" text-anchor="middle" dominant-baseline="middle"
      fill="#666" font-size="11" font-family="'Segoe UI',system-ui,sans-serif" letter-spacing="0.5">${label}</text>`;
  });

  const handAngle = (totalMinutes / 1440) * 360 - 90;
  const handRad   = handAngle * Math.PI / 180;
  const hx = Math.cos(handRad) * ((R_INNER + R_OUTER) / 2);
  const hy = Math.sin(handRad) * ((R_INNER + R_OUTER) / 2);
  html += `<circle cx="${hx.toFixed(2)}" cy="${hy.toFixed(2)}" r="6" fill="#fff" filter="url(#glow)"/>`;

  html += `<text x="0" y="-22" text-anchor="middle" fill="#ffffff" font-size="52" font-weight="700"
    font-family="'Segoe UI',system-ui,sans-serif" letter-spacing="-1">${timeStr}</text>`;
  html += `<text x="0" y="22" text-anchor="middle" fill="#aaa" font-size="16" font-weight="400"
    font-family="'Segoe UI',system-ui,sans-serif" letter-spacing="3">${dayName}</text>`;
  html += `<text x="0" y="44" text-anchor="middle" fill="#666" font-size="12"
    font-family="'Segoe UI',system-ui,sans-serif" letter-spacing="2">${dateStr}</text>`;

  const defs = `<defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>`;

  svg.innerHTML = defs + html;
}

function arcSegment(startTime, endTime, color, label) {
  let startM = timeToMinutes(startTime);
  let endM   = timeToMinutes(endTime);

  if (endM <= startM) endM += 1440;

  const startAngle = (startM / 1440) * 360 - 90;
  const endAngle   = (endM   / 1440) * 360 - 90;
  const spanDeg    = endAngle - startAngle;

  const outerPath = describeArc(0, 0, R_OUTER, startAngle, endAngle);
  const innerPath = describeArc(0, 0, R_INNER, endAngle, startAngle);

  const [ox1,oy1] = polarXY(R_OUTER, startAngle);
  const [ix2,iy2] = polarXY(R_INNER, endAngle);

  const d = `M ${ox1} ${oy1} ${outerPath} L ${ix2} ${iy2} ${innerPath} L ${ox1} ${oy1} Z`;

  const labelHtml = spanDeg > 8 ? buildArcLabel(label, startAngle, endAngle, (R_INNER + R_OUTER) / 2, color) : '';

  return `<path d="${d}" fill="${color}" opacity="0.85"/>` + labelHtml;
}

function buildArcLabel(text, startAngle, endAngle, r, color) {
  const spanDeg = endAngle - startAngle;
  const midAngle = startAngle + spanDeg / 2;

  const textR = r + 2;
  const arcPath = describeArc(0, 0, textR, startAngle + 1, endAngle - 1);
  const [sx, sy] = polarXY(textR, startAngle + 1);

  const pathId = `tp-${Math.abs(startAngle|0)}-${Math.abs(endAngle|0)}`;
  const fs = Math.min(12, Math.max(7, spanDeg * 0.6));

  let pathD;
  if (midAngle > 90 && midAngle < 270) {
    pathD = `M ${polarXY(textR, endAngle - 1).join(' ')} ${describeArc(0, 0, textR, endAngle - 1, startAngle + 1, true)}`;
  } else {
    pathD = `M ${sx} ${sy} ${arcPath}`;
  }

  const textColor = lightenColor(color);

  return `
    <defs>
      <path id="${pathId}" d="${pathD}"/>
    </defs>
    <text font-size="${fs}" font-family="'Segoe UI',system-ui,sans-serif" font-weight="600" fill="${textColor}" letter-spacing="0.5">
      <textPath href="#${pathId}" startOffset="50%" text-anchor="middle">${escHtml(text)}</textPath>
    </text>`;
}

function describeArc(cx, cy, r, startAngle, endAngle, reverse = false) {
  const end = polarXY(r, endAngle, cx, cy);
  const large = (endAngle - startAngle + 360) % 360 > 180 ? 1 : 0;
  const sweep = reverse ? 0 : 1;
  return `A ${r} ${r} 0 ${large} ${sweep} ${end[0].toFixed(2)} ${end[1].toFixed(2)}`;
}

function polarXY(r, angleDeg, cx=0, cy=0) {
  const rad = angleDeg * Math.PI / 180;
  return [+(cx + Math.cos(rad) * r).toFixed(2), +(cy + Math.sin(rad) * r).toFixed(2)];
}

function timeToMinutes(t) {
  const [h,m] = t.split(':').map(Number);
  return h * 60 + m;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function lightenColor(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${Math.min(255,r+80)},${Math.min(255,g+80)},${Math.min(255,b+80)})`;
}

let toastTimer;
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2400);
}

document.getElementById('actName').addEventListener('keydown', e => {
  if (e.key === 'Enter') saveActivity();
});
</script>
</body>
</html>
