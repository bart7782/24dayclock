<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24-Hour Activity Clock</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #141414;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --text-muted: #888;
    --accent: #4a9eff;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 32px;
  }

  h1 {
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .clock-wrap {
    position: relative;
    width: min(520px, 92vw);
    aspect-ratio: 1;
  }

  #clockSvg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .panel {
    width: min(820px, 96vw);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  @media (max-width: 600px) {
    .panel { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card h2 {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .form-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .form-row label {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 1px;
  }

  .form-row input[type="text"],
  .form-row input[type="time"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    width: 100%;
    transition: border-color .15s;
  }

  .form-row input:focus { border-color: var(--accent); }

  .time-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .color-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform .1s, border-color .1s;
    flex-shrink: 0;
  }

  .swatch:hover { transform: scale(1.15); }
  .swatch.selected { border-color: #fff; transform: scale(1.15); }

  .color-custom {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px dashed var(--border);
    cursor: pointer;
    background: transparent;
    padding: 0;
    flex-shrink: 0;
    overflow: hidden;
    position: relative;
  }

  .color-custom input[type="color"] {
    position: absolute;
    inset: -4px;
    width: calc(100% + 8px);
    height: calc(100% + 8px);
    border: none;
    cursor: pointer;
    opacity: 0;
  }

  .btn {
    padding: 10px 18px;
    border-radius: 8px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity .15s, transform .1s;
    letter-spacing: .5px;
  }

  .btn:hover { opacity: .85; }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-ghost {
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .activity-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 340px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .activity-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    background: var(--surface2);
    border-radius: 8px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: border-color .15s;
  }

  .activity-item:hover { border-color: #444; }
  .activity-item.editing { border-color: var(--accent); }

  .act-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .act-info { flex: 1; min-width: 0; }

  .act-name {
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .act-time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
  .act-actions { display: flex; gap: 4px; flex-shrink: 0; }

  .icon-btn {
    background: none;
    border: none;
    color: var(--text-muted);
    cursor: pointer;
    padding: 4px;
    border-radius: 5px;
    line-height: 1;
    font-size: 14px;
    transition: color .15s, background .15s;
  }

  .icon-btn:hover { color: var(--text); background: var(--border); }

  .empty-hint {
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
    padding: 20px 0;
  }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: #222;
    color: #fff;
    padding: 10px 20px;
    border-radius: 8px;
    font-size: 13px;
    pointer-events: none;
    transition: transform .3s ease;
    z-index: 999;
  }

  #toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<h1>24-Hour Activity Clock</h1>

<div class="clock-wrap">
  <svg id="clockSvg" viewBox="-260 -260 520 520"></svg>
</div>

<div class="panel">
  <div class="card">
    <h2 id="formTitle">Add Activity</h2>

    <div class="form-row">
      <label>Activity name</label>
      <input type="text" id="actName" placeholder="e.g. Sleep, Work, Exercise&hellip;" maxlength="40">
    </div>

    <div class="time-row">
      <div class="form-row">
        <label>Start</label>
        <input type="time" id="actStart" value="08:00">
      </div>
      <div class="form-row">
        <label>End</label>
        <input type="time" id="actEnd" value="09:00">
      </div>
    </div>

    <div class="form-row">
      <label>Color</label>
      <div class="color-row" id="colorRow"></div>
    </div>

    <div style="display:flex;gap:10px;flex-wrap:wrap">
      <button type="button" class="btn btn-primary" id="saveBtn">Add Activity</button>
      <button type="button" class="btn btn-ghost" id="cancelBtn" style="display:none">Cancel</button>
    </div>
  </div>

  <div class="card">
    <h2>Activities <span id="actCount" style="color:var(--text-muted);font-weight:400"></span></h2>
    <div class="activity-list" id="activityList">
      <p class="empty-hint">No activities yet.<br>Add one on the left!</p>
    </div>
    <button type="button" class="btn btn-ghost" id="clearBtn" style="font-size:11px">Clear all</button>
  </div>
</div>

<div id="toast"></div>

<script>
var PALETTE = [
  '#4a6fa5','#6a5acd','#9b59b6','#c0392b',
  '#e67e22','#f1c40f','#27ae60','#1abc9c',
  '#16a085','#2980b9','#8e44ad','#d35400',
  '#c0392b','#e91e63','#00bcd4','#795548'
];

var activities = [];
var editingId = null;
var selectedColor = PALETTE[0];

try {
  var _stored = localStorage.getItem('clock-activities');
  if (_stored) activities = JSON.parse(_stored);
} catch (e) {}

document.getElementById('saveBtn').addEventListener('click', saveActivity);
document.getElementById('cancelBtn').addEventListener('click', cancelEdit);
document.getElementById('clearBtn').addEventListener('click', clearAll);
document.getElementById('actName').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') saveActivity();
});

buildSwatches();
render();
setInterval(render, 1000);

function buildSwatches() {
  var row = document.getElementById('colorRow');
  row.innerHTML = '';
  PALETTE.forEach(function (c) {
    var s = document.createElement('div');
    s.className = 'swatch' + (c === selectedColor ? ' selected' : '');
    s.style.background = c;
    s.addEventListener('click', function () { selectColor(c, s); });
    row.appendChild(s);
  });
  var wrap = document.createElement('div');
  wrap.className = 'color-custom';
  wrap.title = 'Custom color';
  wrap.style.background = PALETTE.indexOf(selectedColor) >= 0 ? 'transparent' : selectedColor;
  var picker = document.createElement('input');
  picker.type = 'color';
  picker.value = '#ffffff';
  picker.addEventListener('input', function (e) {
    selectedColor = e.target.value;
    wrap.style.background = selectedColor;
    document.querySelectorAll('.swatch').forEach(function (s) { s.classList.remove('selected'); });
  });
  wrap.appendChild(picker);
  row.appendChild(wrap);
}

function selectColor(c, el) {
  selectedColor = c;
  document.querySelectorAll('.swatch').forEach(function (s) { s.classList.remove('selected'); });
  el.classList.add('selected');
}

function saveActivity() {
  var name  = document.getElementById('actName').value.trim();
  var start = document.getElementById('actStart').value;
  var end   = document.getElementById('actEnd').value;
  if (!name)         { toast('Enter an activity name'); return; }
  if (!start)        { toast('Set a start time'); return; }
  if (!end)          { toast('Set an end time'); return; }
  if (start === end) { toast('Start and end cannot be the same'); return; }
  var id    = (editingId !== null) ? editingId : Date.now();
  var entry = { id: id, name: name, start: start, end: end, color: selectedColor };
  if (editingId !== null) {
    for (var i = 0; i < activities.length; i++) {
      if (activities[i].id === editingId) { activities[i] = entry; break; }
    }
    editingId = null;
  } else {
    activities.push(entry);
  }
  persist();
  resetForm();
  render();
}

function editActivity(id) {
  var a = null;
  for (var i = 0; i < activities.length; i++) {
    if (activities[i].id === id) { a = activities[i]; break; }
  }
  if (!a) return;
  editingId = id;
  document.getElementById('actName').value  = a.name;
  document.getElementById('actStart').value = a.start;
  document.getElementById('actEnd').value   = a.end;
  selectedColor = a.color;
  buildSwatches();
  document.getElementById('formTitle').textContent = 'Edit Activity';
  document.getElementById('saveBtn').textContent   = 'Save Changes';
  document.getElementById('cancelBtn').style.display = '';
  var items = document.getElementById('activityList').querySelectorAll('.activity-item');
  for (var j = 0; j < items.length; j++) {
    items[j].classList.toggle('editing', Number(items[j].dataset.id) === id);
  }
}

function deleteActivity(id) {
  var next = [];
  for (var i = 0; i < activities.length; i++) {
    if (activities[i].id !== id) next.push(activities[i]);
  }
  activities = next;
  if (editingId === id) { editingId = null; resetForm(); }
  persist();
  render();
}

function cancelEdit() { editingId = null; resetForm(); render(); }

function clearAll() {
  if (!activities.length) return;
  if (!confirm('Clear all activities?')) return;
  activities = []; editingId = null;
  persist(); resetForm(); render();
}

function resetForm() {
  document.getElementById('actName').value  = '';
  document.getElementById('actStart').value = '08:00';
  document.getElementById('actEnd').value   = '09:00';
  selectedColor = PALETTE[0];
  buildSwatches();
  document.getElementById('formTitle').textContent = 'Add Activity';
  document.getElementById('saveBtn').textContent   = 'Add Activity';
  document.getElementById('cancelBtn').style.display = 'none';
}

function persist() {
  try { localStorage.setItem('clock-activities', JSON.stringify(activities)); } catch (e) {}
}

function render() { renderList(); renderClock(); }

function renderList() {
  var el    = document.getElementById('activityList');
  var count = document.getElementById('actCount');
  count.textContent = activities.length ? '(' + activities.length + ')' : '';
  if (!activities.length) {
    el.innerHTML = '<p class="empty-hint">No activities yet.<br>Add one on the left!</p>';
    return;
  }
  var sorted = activities.slice().sort(function (a, b) {
    return timeToMinutes(a.start) - timeToMinutes(b.start);
  });
  var html = '';
  for (var i = 0; i < sorted.length; i++) {
    var a = sorted[i];
    var startM = timeToMinutes(a.start);
    var endM   = timeToMinutes(a.end);
    if (endM <= startM) endM += 1440;
    var dur    = endM - startM;
    var h      = Math.floor(dur / 60);
    var m      = dur % 60;
    var durStr = h ? h + 'h ' + m + 'm' : m + 'm';
    var cls    = 'activity-item' + (editingId === a.id ? ' editing' : '');
    html += '<div class="' + cls + '" data-id="' + a.id + '">' +
      '<div class="act-dot" style="background:' + a.color + '"></div>' +
      '<div class="act-info">' +
        '<div class="act-name">' + escHtml(a.name) + '</div>' +
        '<div class="act-time">' + a.start + ' &ndash; ' + a.end + ' &nbsp;&middot;&nbsp; ' + durStr + '</div>' +
      '</div>' +
      '<div class="act-actions">' +
        '<button type="button" class="icon-btn" data-del="' + a.id + '" title="Delete">&times;</button>' +
      '</div></div>';
  }
  el.innerHTML = html;
  var items = el.querySelectorAll('.activity-item');
  for (var j = 0; j < items.length; j++) {
    (function (item) {
      var itemId = Number(item.dataset.id);
      item.addEventListener('click', function () { editActivity(itemId); });
      var del = item.querySelector('[data-del]');
      if (del) del.addEventListener('click', function (e) { e.stopPropagation(); deleteActivity(itemId); });
    })(items[j]);
  }
}

var R_OUTER = 220, R_INNER = 160;
var R_TICKS_OUTER = 225, R_TICKS_INNER_H = 210, R_TICKS_INNER_M = 215, R_LABELS = 240;

function renderClock() {
  var svg = document.getElementById('clockSvg');
  var now = new Date();
  var totalMin = now.getHours() * 60 + now.getMinutes() + now.getSeconds() / 60;
  var DAY   = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
  var MON   = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  var timeStr = pad(now.getHours()) + ':' + pad(now.getMinutes());
  var dayName = DAY[now.getDay()];
  var dateStr = MON[now.getMonth()] + ' ' + now.getDate();

  var html = '<circle cx="0" cy="0" r="' + R_OUTER + '" fill="#111" stroke="#1a1a1a" stroke-width="1"/>';
  for (var ai = 0; ai < activities.length; ai++) html += arcSegment(activities[ai]);

  for (var i = 0; i < 1440; i += 5) {
    var isH = (i % 60 === 0), isQ = (i % 15 === 0);
    var a = (i / 1440) * 360 - 90, rd = a * Math.PI / 180;
    var inn = isH ? R_TICKS_INNER_H : (isQ ? 213 : R_TICKS_INNER_M);
    html += '<line x1="'+fmt(Math.cos(rd)*inn)+'" y1="'+fmt(Math.sin(rd)*inn)+'"'+
            ' x2="'+fmt(Math.cos(rd)*R_TICKS_OUTER)+'" y2="'+fmt(Math.sin(rd)*R_TICKS_OUTER)+'"'+
            ' stroke="'+(isH?'#888':'#444')+'" stroke-width="'+(isH?1.5:0.7)+'"/>';
  }

  [[0,'00:00'],[360,'6:00'],[720,'12:00'],[1080,'18:00']].forEach(function(p) {
    var a = (p[0]/1440)*360-90, rd = a*Math.PI/180;
    html += '<text x="'+fmt(Math.cos(rd)*R_LABELS)+'" y="'+fmt(Math.sin(rd)*R_LABELS)+'"'+
            ' text-anchor="middle" dominant-baseline="middle" fill="#666" font-size="11" font-family="sans-serif">'+p[1]+'</text>';
  });

  var ha = (totalMin/1440)*360-90, hr = ha*Math.PI/180, hm = (R_INNER+R_OUTER)/2;
  html += '<circle cx="'+fmt(Math.cos(hr)*hm)+'" cy="'+fmt(Math.sin(hr)*hm)+'" r="6" fill="#fff" filter="url(#glow)"/>';
  html += '<text x="0" y="-22" text-anchor="middle" fill="#fff" font-size="52" font-weight="700" font-family="sans-serif">'+timeStr+'</text>';
  html += '<text x="0" y="22"  text-anchor="middle" fill="#aaa" font-size="16" font-family="sans-serif" letter-spacing="3">'+dayName+'</text>';
  html += '<text x="0" y="44"  text-anchor="middle" fill="#666" font-size="12" font-family="sans-serif" letter-spacing="2">'+dateStr+'</text>';

  svg.innerHTML = '<defs><filter id="glow" x="-50%" y="-50%" width="200%" height="200%">'+
    '<feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>'+
    '</filter></defs>' + html;
}

function arcSegment(a) {
  var startM = timeToMinutes(a.start), endM = timeToMinutes(a.end);
  if (endM <= startM) endM += 1440;
  var sa = (startM / 1440) * 360 - 90;
  var ea = (endM   / 1440) * 360 - 90;
  var span = ea - sa;
  var p1 = polar(R_OUTER, sa), p2 = polar(R_INNER, ea);
  var d = 'M '+p1[0]+' '+p1[1]+' '+arc(R_OUTER,sa,ea,1)+' L '+p2[0]+' '+p2[1]+' '+arc(R_INNER,ea,sa,0)+' Z';
  var lbl = span > 8 ? arcLabel(a.name, sa, ea, (R_INNER+R_OUTER)/2, a.color) : '';
  return '<path d="'+d+'" fill="'+a.color+'" opacity="0.85"/>'+lbl;
}

function arcLabel(text, sa, ea, r, color) {
  var span = ea - sa, mid = sa + span / 2, tr = r + 2;
  var fs   = Math.min(12, Math.max(7, span * 0.6));
  var pid  = 'p' + (Math.abs(sa*10)|0) + '_' + (Math.abs(ea*10)|0);
  var pathD;
  if (mid > 90 && mid < 270) {
    var ep = polar(tr, ea-1);
    pathD = 'M '+ep[0]+' '+ep[1]+' '+arc(tr, ea-1, sa+1, 0);
  } else {
    var sp = polar(tr, sa+1);
    pathD = 'M '+sp[0]+' '+sp[1]+' '+arc(tr, sa+1, ea-1, 1);
  }
  return '<defs><path id="'+pid+'" d="'+pathD+'"/></defs>'+
    '<text font-size="'+fs+'" font-family="sans-serif" font-weight="600" fill="'+lighten(color)+'">' +
    '<textPath href="#'+pid+'" startOffset="50%" text-anchor="middle">'+escHtml(text)+'</textPath></text>';
}

// arc: SVG arc command. sweep=1 clockwise, sweep=0 counter-clockwise.
// large-arc-flag depends on which direction we travel, so we compute
// the span in the direction of sweep, not always end-start.
function arc(r, sa, ea, sweep) {
  var ep   = polar(r, ea);
  var diff = ea - sa;
  var span = sweep ? ((diff % 360) + 360) % 360 : ((-diff % 360) + 360) % 360;
  var large = span > 180 ? 1 : 0;
  return 'A '+r+' '+r+' 0 '+large+' '+sweep+' '+ep[0]+' '+ep[1];
}

function polar(r, deg) {
  var rd = deg * Math.PI / 180;
  return [fmt(Math.cos(rd)*r), fmt(Math.sin(rd)*r)];
}

function fmt(n)  { return n.toFixed(2); }
function pad(n)  { return n < 10 ? '0'+n : ''+n; }

function timeToMinutes(t) {
  var p = t.split(':');
  return parseInt(p[0],10)*60 + parseInt(p[1],10);
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function lighten(hex) {
  var r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return 'rgb('+Math.min(255,r+80)+','+Math.min(255,g+80)+','+Math.min(255,b+80)+')';
}

var toastTimer;
function toast(msg) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
}
</script>
</body>
</html>
